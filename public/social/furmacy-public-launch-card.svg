<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Furmacy public launch card</title>
  <desc id="desc">A public launch marketing card for Furmacy, a free iPhone app for pet medication care.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FAF7F2"/>
      <stop offset="0.55" stop-color="#EDF7F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0D3B47" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="42" y="42" width="1116" height="546" rx="42" fill="#FFFFFF" stroke="#C8E4E0" stroke-width="4"/>

  <g transform="translate(86 76)">
    <rect width="92" height="92" rx="24" fill="#1FA19C"/>
    <rect x="1.5" y="1.5" width="89" height="89" rx="22.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>
    <g fill="#FFFFFF">
      <circle cx="32" cy="39" r="6"/>
      <circle cx="46" cy="33" r="6.5"/>
      <circle cx="60" cy="39" r="6"/>
      <path d="M46 45c-16 0-27 11-27 22 0 9 11 13 27 13s27-4 27-13c0-11-11-22-27-22Z"/>
    </g>
  </g>

  <text x="206" y="126" fill="#0D3B47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="800">Furmacy</text>
  <text x="208" y="170" fill="#0E7A75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">Pet medication reminders and records for iPhone</text>

  <g transform="translate(86 218)">
    <text fill="#0D3B47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800">
      <tspan x="0" dy="0">Free to download.</tspan>
      <tspan x="0" dy="62">One pet free.</tspan>
    </text>
    <text x="0" y="146" fill="#636E75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500">
      <tspan x="0" dy="0">Upgrade to Pro for unlimited pets and meds,</tspan>
      <tspan x="0" dy="42">iCloud sync, full history, and expanded documents.</tspan>
    </text>

    <g transform="translate(0 268)">
      <rect width="360" height="64" rx="20" fill="#0D3B47"/>
      <text x="32" y="41" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800">Download on the App Store</text>
    </g>
    <text x="0" y="338" fill="#0E7A75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">furmacy.org</text>
  </g>

  <g transform="translate(802 92)" filter="url(#shadow)">
    <rect width="250" height="456" rx="46" fill="#0D3B47"/>
    <rect x="15" y="15" width="220" height="426" rx="34" fill="#FFFFFF"/>
    <rect x="86" y="30" width="98" height="20" rx="10" fill="#0D3B47"/>
    <text x="40" y="105" fill="#0D3B47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="800">Today</text>
    <text x="40" y="136" fill="#636E75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Medication plan</text>
    <rect x="40" y="166" width="170" height="78" rx="23" fill="#E8FAF7" stroke="#C8E4E0" stroke-width="2"/>
    <text x="60" y="205" fill="#0E7A75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">in 5h</text>
    <text x="60" y="232" fill="#636E75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">8:00 PM · Luna</text>
    <rect x="40" y="270" width="170" height="66" rx="21" fill="#FFFFFF" stroke="#C8E4E0" stroke-width="2"/>
    <text x="60" y="322" fill="#0D3B47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">Amoxicillin</text>
    <rect x="158" y="300" width="52" height="24" rx="12" fill="#FCE2DF"/>
    <text x="172" y="318" fill="#E86861" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800">Missed</text>
    <rect x="40" y="356" width="170" height="66" rx="21" fill="#FFFFFF" stroke="#C8E4E0" stroke-width="2"/>
    <text x="60" y="398" fill="#0D3B47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">Heartgard</text>
    <rect x="150" y="377" width="52" height="24" rx="12" fill="#F2F4F5"/>
    <text x="163" y="395" fill="#636E75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800">Due</text>
  </g>
</svg>
